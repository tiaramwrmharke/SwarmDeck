name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
          # bundled-npm cache probe would trip the devEngines npm pin (see ci.yml)
          package-manager-cache: false

      - run: bash scripts/activate-toolchain.sh
      - run: npm ci
      - run: npm run verify:toolchain

      - run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The reusable core is published alongside helio on every release, for EXTERNAL
      # reuse. helio itself bundles packages/kernel/dist in its own tarball, so this
      # step failing (e.g. @helio scope missing / NPM_TOKEN lacks scope access) must NOT
      # block the release — helio already published and works off the bundled copy.
      - name: Publish @helio/kernel to npm
        continue-on-error: true
        run: |
          npx tsc -p packages/kernel/tsconfig.json
          npm publish ./packages/kernel --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
